# Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec

version: "1"

services:
  # ==========================================
  # SmartCine Backend REST API & Socket.IO
  # ==========================================
  - type: web
    name: smartcine-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTO_SEED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        fromService:
          type: web
          name: smartcine-frontend
          property: host

  # ==========================================
  # SmartCine Frontend Web Client (React/Vite)
  # ==========================================
  - type: web
    name: smartcine-frontend
    runtime: static
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smartcine-backend
          property: host
