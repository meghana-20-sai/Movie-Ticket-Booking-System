# Render Blueprint for Standalone Backend Deployment
# https://render.com/docs/blueprint-spec

version: "1"

services:
  - type: web
    name: smartcine-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTO_SEED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        value: "*"
